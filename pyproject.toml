[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "literary_analysis"
version = "1"
authors = [
    {name = "Wojciech Socha"}
]
description = "Projekt zaliczeniowy - Narzędzia programistyczne w Pythonie wspierające analizę danych"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "matplotlib"
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]